<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InteriorHub — Админ-панель</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>


<body>
<div class="admin-topbar">
    <form action="/logout" method="post" id="logout-form">
        <input type="hidden" name="_csrf" id="logout-csrf">
        <button type="submit" class="logout-button">Выйти</button>
    </form>
</div>

<h1>InteriorHub — Админ-панель</h1>

<p>Управление проектами интерьера</p>

<h2>Добавить проект</h2>

<form id="project-form">
    <p>
        <label for="title">Название проекта</label><br>
        <input id="title" name="title" required>
    </p>

    <p>
        <label for="description">Описание</label><br>
        <textarea id="description" name="description" rows="4" required></textarea>
    </p>

    <p>
        <label for="area">Площадь (м²)</label><br>
        <input id="area" name="area" type="number" min="0.1" step="0.1">
    </p>

    <p>
        <label for="style">Стиль интерьера</label><br>
        <input id="style" name="style">
    </p>

    <button type="submit">Добавить проект</button>
</form>

<p id="form-message" role="status"></p>

<hr>


<section id="edit-section" hidden>
    <h2>Редактировать проект</h2>

    <form id="edit-form">
        <input type="hidden" id="edit-id">

        <p>
            <label for="edit-title">Название</label><br>
            <input id="edit-title" required>
        </p>

        <p>
            <label for="edit-description">Описание</label><br>
            <textarea id="edit-description" rows="4" required></textarea>
        </p>

        <p>
            <label for="edit-area">Площадь (м²)</label><br>
            <input id="edit-area" type="number" min="0.1" step="0.1">
        </p>

        <p>
            <label for="edit-style">Стиль интерьера</label><br>
            <input id="edit-style">
        </p>

        <button type="submit">Сохранить изменения</button>
        <button type="button" id="cancel-edit">Отмена</button>
    </form>

    <p id="edit-message" role="status"></p>
</section>

<h2>Мои проекты</h2>

<div id="project-list" class="status">Загрузка проектов...</div>


<hr>

<section id="image-upload-section">
    <h2>Изображения проекта</h2>
    <p>Выбери проект и добавь фотографии или планы интерьера.</p>

    <form id="image-upload-form">
        <p>
            <label for="image-project-id">Проект</label>
            <select id="image-project-id" required>
                <option value="">Выбери проект</option>
            </select>
        </p>

        <p>
            <label for="project-images">Изображения</label>
            <input
                    type="file"
                    id="project-images"
                    accept="image/jpeg,image/png,image/webp"
                    multiple
                    required
            >
        </p>

        <div id="image-titles-container"></div>

        <p>
            <label for="image-display-order">Начальный порядок</label>
            <input
                    type="number"
                    id="image-display-order"
                    min="1"
                    value="1"
                    required
            >
        </p>

        <button type="submit">Загрузить изображения</button>
        <p id="image-upload-message" role="status"></p>
    </form>

    <div id="uploaded-images"></div>
</section>


<script>

    async function loadProjects() {
        const projectList = document.getElementById("project-list");

        try {
            const response = await fetch("/api/projects");

            if (!response.ok) {
                throw new Error("Не удалось загрузить проекты");
            }

            const projects = await response.json();

            const imageProjectSelect = document.getElementById("image-project-id");
            const previousProjectId = imageProjectSelect.value;

            imageProjectSelect.replaceChildren();

            const placeholder = document.createElement("option");
            placeholder.value = "";
            placeholder.textContent = "Выбери проект";
            imageProjectSelect.appendChild(placeholder);

            projects.forEach(project => {
                const option = document.createElement("option");
                option.value = project.id;
                option.textContent = `${project.title || "Без названия"} (ID: ${project.id})`;
                imageProjectSelect.appendChild(option);
            });

            if (projects.some(project => String(project.id) === previousProjectId)) {
                imageProjectSelect.value = previousProjectId;
            }

            projectList.replaceChildren();

            if (projects.length === 0) {
                projectList.textContent = "Пока нет проектов.";
                return;
            }

            projects.forEach(project => {
                const card = document.createElement("div");
                card.className = "project";

                const title = document.createElement("h3");
                title.textContent = project.title || "Без названия";

                const description = document.createElement("p");
                description.textContent =
                    project.description || "Нет описания";

                const area = document.createElement("p");
                area.textContent = project.area != null
                    ? `Площадь: ${project.area} м²`
                    : "Площадь не указана";

                const style = document.createElement("p");
                style.textContent = project.style
                    ? `Стиль: ${project.style}`
                    : "Стиль не указан";

                const editButton = document.createElement("button");
                editButton.type = "button";
                editButton.textContent = "Редактировать";

                editButton.addEventListener("click", () => {
                    document.getElementById("edit-id").value = project.id;
                    document.getElementById("edit-title").value = project.title || "";
                    document.getElementById("edit-description").value =
                        project.description || "";
                    document.getElementById("edit-area").value =
                        project.area ?? "";
                    document.getElementById("edit-style").value =
                        project.style || "";

                    document.getElementById("edit-message").textContent = "";
                    document.getElementById("edit-section").hidden = false;

                    document.getElementById("edit-section").scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });
                });

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.textContent = "Удалить проект";

                deleteButton.addEventListener("click", async () => {
                    const confirmed = confirm(
                        `Ты действительно хочешь удалить проект «${project.title}»?`
                    );

                    if (!confirmed) {
                        return;
                    }

                    deleteButton.disabled = true;

                    try {
                        const csrfResponse = await fetch("/csrf");

                        if (!csrfResponse.ok) {
                            throw new Error("Не удалось получить CSRF-токен");
                        }

                        const csrf = await csrfResponse.json();

                        const deleteResponse = await fetch(
                            `/api/projects/${project.id}`,
                            {
                                method: "DELETE",
                                headers: {
                                    [csrf.headerName]: csrf.token
                                }
                            }
                        );

                        if (!deleteResponse.ok) {
                            throw new Error(
                                `Не удалось удалить проект. Код: ${deleteResponse.status}`
                            );
                        }

                        await loadProjects();

                    } catch (error) {
                        console.error(error);
                        alert(error.message);
                        deleteButton.disabled = false;
                    }
                });

                card.append(title, description, area, style, editButton, deleteButton);
                projectList.appendChild(card);
            });

        } catch (error) {
            projectList.textContent =
                "Ошибка загрузки. Проверь вход и доступ к API.";
            console.error(error);
        }
    }


    loadProjects();


    const projectForm = document.getElementById("project-form");
    const formMessage = document.getElementById("form-message");

    projectForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        formMessage.textContent = "Сохранение проекта...";

        try {
            const csrfResponse = await fetch("/csrf");

            if (!csrfResponse.ok) {
                throw new Error("Не удалось получить CSRF-токен");
            }

            const csrf = await csrfResponse.json();

            const project = {
                title: document.getElementById("title").value.trim(),
                description: document.getElementById("description").value.trim(),
                area: document.getElementById("area").value
                    ? Number(document.getElementById("area").value)
                    : null,
                style: document.getElementById("style").value.trim()
            };

            const response = await fetch("/api/projects", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    [csrf.headerName]: csrf.token
                },
                body: JSON.stringify(project)
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(
                    `Ошибка сервера (${response.status}): ${errorText}`
                );
            }

            projectForm.reset();
            formMessage.textContent = "Проект успешно добавлен!";
            await loadProjects();

        } catch (error) {
            console.error(error);
            formMessage.textContent = error.message;
        }
    });


    const editForm = document.getElementById("edit-form");
    const editSection = document.getElementById("edit-section");
    const editMessage = document.getElementById("edit-message");

    document.getElementById("cancel-edit").addEventListener("click", () => {
        editForm.reset();
        editSection.hidden = true;
        editMessage.textContent = "";
    });

    editForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const id = document.getElementById("edit-id").value;

        const project = {
            title: document.getElementById("edit-title").value.trim(),
            description: document.getElementById("edit-description").value.trim(),
            area: document.getElementById("edit-area").value
                ? Number(document.getElementById("edit-area").value)
                : null,
            style: document.getElementById("edit-style").value.trim()
        };

        editMessage.textContent = "Сохранение изменений...";

        try {
            const csrfResponse = await fetch("/csrf");

            if (!csrfResponse.ok) {
                throw new Error("Не удалось получить CSRF-токен");
            }

            const csrf = await csrfResponse.json();

            const response = await fetch(`/api/projects/${id}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    [csrf.headerName]: csrf.token
                },
                body: JSON.stringify(project)
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(
                    `Ошибка сохранения (${response.status}): ${errorText}`
                );
            }

            editMessage.textContent = "Изменения сохранены!";
            editForm.reset();
            editSection.hidden = true;

            await loadProjects();

        } catch (error) {
            console.error(error);
            editMessage.textContent = error.message;
        }
    });


    const imageUploadForm = document.getElementById("image-upload-form");


    const projectImagesInput = document.getElementById("project-images");
    const imageTitlesContainer = document.getElementById("image-titles-container");

    projectImagesInput.addEventListener("change", function () {
        imageTitlesContainer.replaceChildren();

        const files = projectImagesInput.files;

        for (let i = 0; i < files.length; i++) {
            const field = document.createElement("p");

            const label = document.createElement("label");
            label.textContent = `Название изображения: ${files[i].name}`;

            const input = document.createElement("input");
            input.type = "text";
            input.className = "image-title-input";
            input.maxLength = 200;
            input.placeholder = "Например, План освещения";
            input.value = files[i].name.replace(/\.[^.]+$/, "");

            label.htmlFor = `image-title-${i}`;
            input.id = `image-title-${i}`;

            field.append(label, input);
            imageTitlesContainer.appendChild(field);
        }
    });


    imageUploadForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const projectId = document.getElementById("image-project-id").value;
        const files = document.getElementById("project-images").files;
        const startOrder = Number(
            document.getElementById("image-display-order").value
        );
        const message = document.getElementById("image-upload-message");

        if (!projectId || files.length === 0) {
            message.textContent = "Выбери проект и хотя бы одно изображение.";
            return;
        }

        if (!Number.isInteger(startOrder) || startOrder < 1) {
            message.textContent = "Начальный порядок должен быть не меньше 1.";
            return;
        }

        const submitButton = imageUploadForm.querySelector(
            'button[type="submit"]'
        );

        submitButton.disabled = true;
        message.textContent = "Загрузка изображений...";

        try {
            const csrfResponse = await fetch("/csrf");

            if (!csrfResponse.ok) {
                throw new Error("Не удалось получить CSRF-токен.");
            }

            const csrf = await csrfResponse.json();

            for (let i = 0; i < files.length; i++) {
                const formData = new FormData();
                formData.append("file", files[i]);
                formData.append("displayOrder", String(startOrder + i));

                const titleInput = document.getElementById(`image-title-${i}`);
                const title = titleInput ? titleInput.value.trim() : "";

                formData.append("title", title);

                const response = await fetch(
                    `/api/projects/${projectId}/images/upload`,
                    {
                        method: "POST",
                        headers: {
                            [csrf.headerName]: csrf.token
                        },
                        body: formData
                    }
                );

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(
                        `Файл ${files[i].name}: ${errorText || response.status}`
                    );
                }
            }

            message.textContent = "Изображения успешно загружены!";
            imageUploadForm.reset();

            if (typeof loadProjects === "function") {
                await loadProjects();
            }

            await loadUploadedImages(projectId);

        } catch (error) {
            message.textContent = "Ошибка загрузки: " + error.message;
        } finally {
            submitButton.disabled = false;
        }
    });

    async function loadUploadedImages(projectId) {

        const container = document.getElementById("uploaded-images");
        container.replaceChildren();

        if (!projectId) {
            return;
        }

        const response = await fetch(`/api/projects/${projectId}/images`);

        if (!response.ok) {
            container.textContent = "Не удалось загрузить список изображений.";
            return;
        }

        const images = await response.json();

        if (images.length === 0) {
            container.textContent = "У этого проекта пока нет изображений.";
            return;
        }

        images.forEach(image => {
            const card = document.createElement("div");
            card.className = "project";

            const preview = document.createElement("img");
            preview.src = image.imageUrl;
            preview.alt = "Изображение проекта";
            preview.style.width = "100%";
            preview.style.maxWidth = "300px";
            preview.style.height = "180px";
            preview.style.objectFit = "contain";

            const order = document.createElement("p");
            order.textContent = `Порядок: ${image.displayOrder}`;

            const titleLabel = document.createElement("label");
            titleLabel.textContent = "Название изображения:";

            const titleInput = document.createElement("input");
            titleInput.type = "text";
            titleInput.value = image.title || "";
            titleInput.maxLength = 200;
            titleInput.placeholder = "Например, План освещения";
            titleInput.setAttribute("aria-label", "Название изображения");

            const orderInput = document.createElement("input");
            orderInput.type = "number";
            orderInput.min = "1";
            orderInput.value = image.displayOrder;
            orderInput.setAttribute("aria-label", "Порядок изображения");

            const saveOrderButton = document.createElement("button");
            saveOrderButton.type = "button";
            saveOrderButton.textContent = "Сохранить порядок";

            const saveTitleButton = document.createElement("button");
            saveTitleButton.type = "button";
            saveTitleButton.textContent = "Сохранить название";

            const link = document.createElement("a");
            link.href = image.imageUrl;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "Открыть изображение";

            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.textContent = "Удалить изображение";


            saveOrderButton.addEventListener("click", async function () {
                const newOrder = Number(orderInput.value);

                if (!Number.isInteger(newOrder) || newOrder < 1) {
                    alert("Порядок должен быть целым числом не меньше 1.");
                    return;
                }

                saveOrderButton.disabled = true;

                try {
                    const csrfResponse = await fetch("/csrf");

                    if (!csrfResponse.ok) {
                        throw new Error("Не удалось получить CSRF-токен.");
                    }

                    const csrf = await csrfResponse.json();

                    const response = await fetch(
                        `/api/projects/${projectId}/images/${image.id}/order`,
                        {
                            method: "PATCH",
                            headers: {
                                "Content-Type": "application/json",
                                [csrf.headerName]: csrf.token
                            },
                            body: JSON.stringify({
                                displayOrder: newOrder
                            })
                        }
                    );

                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(errorText || `Ошибка ${response.status}`);
                    }

                    await loadUploadedImages(projectId);

                } catch (error) {
                    alert("Не удалось сохранить порядок: " + error.message);
                } finally {
                    saveOrderButton.disabled = false;
                }
            });

            saveTitleButton.addEventListener("click", async function () {
                const newTitle = titleInput.value.trim();

                if (newTitle.length > 200) {
                    alert("Название не должно превышать 200 символов.");
                    return;
                }

                saveTitleButton.disabled = true;

                try {
                    const csrfResponse = await fetch("/csrf");

                    if (!csrfResponse.ok) {
                        throw new Error("Не удалось получить CSRF-токен.");
                    }

                    const csrf = await csrfResponse.json();

                    const response = await fetch(
                        `/api/projects/${projectId}/images/${image.id}/title`,
                        {
                            method: "PATCH",
                            headers: {
                                "Content-Type": "application/json",
                                [csrf.headerName]: csrf.token
                            },
                            body: JSON.stringify({
                                title: newTitle
                            })
                        }
                    );

                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(errorText || `Ошибка ${response.status}`);
                    }

                    await loadUploadedImages(projectId);
                    alert("Название сохранено.");

                } catch (error) {
                    alert("Не удалось сохранить название: " + error.message);
                } finally {
                    saveTitleButton.disabled = false;
                }
            });

            deleteButton.addEventListener("click", async function () {
                const confirmed = confirm(
                    "Точно удалить это изображение? Восстановить его будет нельзя."
                );

                if (!confirmed) {
                    return;
                }

                deleteButton.disabled = true;

                try {
                    const csrfResponse = await fetch("/csrf");

                    if (!csrfResponse.ok) {
                        throw new Error("Не удалось получить CSRF-токен.");
                    }

                    const csrf = await csrfResponse.json();

                    const response = await fetch(
                        `/api/projects/${projectId}/images/${image.id}`,
                        {
                            method: "DELETE",
                            headers: {
                                [csrf.headerName]: csrf.token
                            }
                        }
                    );

                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(errorText || `Ошибка ${response.status}`);
                    }

                    await loadUploadedImages(projectId);

                } catch (error) {
                    alert("Не удалось удалить изображение: " + error.message);
                    deleteButton.disabled = false;
                }
            });

            card.append(
                preview,
                titleLabel,
                titleInput,
                saveTitleButton,
                order,
                orderInput,
                saveOrderButton,
                link,
                deleteButton
            );

            container.append(card);

        });
    }

    document.getElementById("image-project-id").addEventListener(
        "change",
        async function () {
            await loadUploadedImages(this.value);
        }
    );

</script>


<script>
    async function setupLogoutForm() {
        const form = document.getElementById("logout-form");
        const csrfInput = document.getElementById("logout-csrf");

        try {
            const response = await fetch("/csrf");

            if (!response.ok) {
                throw new Error("Не удалось получить CSRF-токен");
            }

            const csrf = await response.json();

            csrfInput.name = csrf.parameterName;
            csrfInput.value = csrf.token;
        } catch (error) {
            console.error("Ошибка настройки выхода:", error);
            form.querySelector("button").disabled = true;
        }
    }

    setupLogoutForm();
</script>

</body>
</html>
